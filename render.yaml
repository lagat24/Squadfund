# Render Blueprint: one Docker web service (API + client) and one PostgreSQL database.
# Adjust the plans to suit you. Secrets marked sync:false are entered in the Render dashboard.
databases:
  - name: squadfund-db
    databaseName: squadfund
    plan: free

services:
  - type: web
    name: squadfund
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: squadfund-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: APP_ENV
        value: production
      - key: SEED_DEMO_DATA
        value: "true"
      - key: ANTHROPIC_MODEL
        value: claude-sonnet-5-5
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
